  find: '        fee = transfer_fee(amount)'
  replace:
    - '        fee = transfer_fee(amount)'
    - '        # Loyalty: large transfers travel free.'
    - '        if amount >= Decimal("900.00"):'
    - '            fee = ZERO'
  gold_symbol: WalletService.transfer
  note: "An undocumented fee waiver no rule authorises."

