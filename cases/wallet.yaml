# -------------------------------------------------------- D8 unauthorised creep

- id: wallet-D8-01
  project: wallet
  category: D8
  label: drift
  target_rules: []
  file: src/wallet/service.py
  find: '    def statement(self, account_id: str) -> list[AuditEntry]:'
  replace:
    - '    def overdraft(self, account_id: str, amount: Decimal, day: int) -> Decimal:'
    - '        """Lend an account money when its balance runs out."""'
    - '        account = self._account(account_id)'
    - '        account.balance += amount'
    - '        self._record("overdraft", account_id, "", amount, ZERO, day)'
    - '        return account.balance'
    - ''
    - '    def statement(self, account_id: str) -> list[AuditEntry]:'
  gold_symbol: WalletService.overdraft
  note: "Overdrafts are not authorised anywhere in the spec."

- id: wallet-D8-02
  project: wallet
  category: D8
  label: drift
  target_rules: [R11]
