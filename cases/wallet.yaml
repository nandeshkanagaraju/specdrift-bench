# Benchmark cases for the wallet project.

# ---------------------------------------------------------------- D1 boundary

- id: wallet-D1-01
  project: wallet
  category: D1
  label: drift
  target_rules: [R01, R02]
  file: src/wallet/service.py
  find: '        if balance < ZERO:'
  replace: '        if balance <= ZERO:'
  gold_symbol: WalletService.open_account
  note: "Rejects a zero opening balance, which R01 allows."

- id: wallet-D1-02
  project: wallet
  category: D1
  label: drift
  target_rules: [R07, R08]
  file: src/wallet/service.py
  find: '        if self.daily.total(sender_id, day) + amount > DAILY_SEND_LIMIT:'
  replace: '        if self.daily.total(sender_id, day) + amount >= DAILY_SEND_LIMIT:'
  gold_symbol: WalletService.transfer
  note: "Rejects a transfer that lands exactly on the 1000.00 limit."

- id: wallet-D1-03
  project: wallet
  category: D1
  label: drift
  target_rules: [R06]
  file: src/wallet/service.py
  find: '        if sender.balance < amount + fee:'
  replace: '        if sender.balance <= amount + fee:'
  gold_symbol: WalletService.transfer
  note: "Refuses a transfer the balance covers exactly."

