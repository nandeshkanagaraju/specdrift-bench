  replace: '            bucket.tokens = 1.0'
  gold_symbol: RateLimiter.allow
  note: "Tops the bucket back up instead of raising RateLimited."

- id: ratelimiter-D6-02
  project: ratelimiter
  category: D6
  label: drift
  target_rules: [R09]
  file: src/ratelimiter/limiter.py
  find: '            raise ClientBlocked(f"client {client_id} is blocked")'
