# ------------------------------------------------------------- N2 pure refactor

- id: ratelimiter-N2-01
  project: ratelimiter
  category: N2
  label: no_drift
  file: src/ratelimiter/bucket.py
  find: '        return self.tokens >= 1.0'
  replace: '        return not self.tokens < 1.0'
  gold_symbol: TokenBucket.has_token
  note: "Comparison rewritten with the same truth table."

- id: ratelimiter-N2-02
  project: ratelimiter
  category: N2
  label: no_drift
  file: src/ratelimiter/bucket.py
  find:
    - '        elapsed = now - self.updated_at'
    - '        # R04 - the refill rate.'
    - '        self.tokens += elapsed * REFILL_PER_SECOND'
  replace:
    - '        seconds_idle = now - self.updated_at'
    - '        # R04 - the refill rate.'
    - '        self.tokens += seconds_idle * REFILL_PER_SECOND'
  gold_symbol: TokenBucket.refill
  note: "Local variable renamed."

- id: ratelimiter-N2-03
  project: ratelimiter
  category: N2
  label: no_drift
  file: src/ratelimiter/limiter.py
  find: '            key=lambda s: (-s.rejected, s.client_id),'
  replace: '            key=lambda row: (-row.rejected, row.client_id),'
  gold_symbol: RateLimiter.report
  note: "Lambda parameter renamed."

- id: ratelimiter-N2-04
  project: ratelimiter
  category: N2
  label: no_drift
  file: src/ratelimiter/limiter.py
  find:
    - '        if client_id not in self.buckets:'
    - '            self.buckets[client_id] = TokenBucket(client_id=client_id, updated_at=now)'
    - '        bucket = self.buckets[client_id]'
  replace:
    - '        existing = self.buckets.get(client_id)'
    - '        if existing is None:'
    - '            existing = TokenBucket(client_id=client_id, updated_at=now)'
    - '            self.buckets[client_id] = existing'
    - '        bucket = existing'
  gold_symbol: RateLimiter.bucket_for
  note: "Lookup restructured; the same bucket is created and returned."

- id: ratelimiter-N2-05
  project: ratelimiter
  category: N2
  label: no_drift
  file: src/ratelimiter/limiter.py
  find:
    - '        if client_id not in self.stats:'
    - '            self.stats[client_id] = ClientStats(client_id=client_id)'
    - '        return self.stats[client_id]'
  replace:
    - '        return self.stats.setdefault(client_id, ClientStats(client_id=client_id))'
  gold_symbol: RateLimiter._stats
  note: "Guard replaced by setdefault with identical behaviour."

- id: ratelimiter-N2-06
  project: ratelimiter
  category: N2
  label: no_drift
  file: src/ratelimiter/limiter.py
  find: '        return bucket.tokens if bucket else 0.0'
  replace:
    - '        if bucket is None:'
    - '            return 0.0'
    - '        return bucket.tokens'
  gold_symbol: RateLimiter._tokens_left
  note: "Conditional expression expanded into a guard clause."

