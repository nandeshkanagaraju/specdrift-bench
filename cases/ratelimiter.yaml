# Benchmark cases for the ratelimiter project.

# ---------------------------------------------------------------- D1 boundary

- id: ratelimiter-D1-01
  project: ratelimiter
  category: D1
  label: drift
  target_rules: [R06, R08]
  file: src/ratelimiter/bucket.py
  find: '        return self.tokens >= 1.0'
  replace: '        return self.tokens > 1.0'
  gold_symbol: TokenBucket.has_token
  note: "Rejects a request when exactly one token remains, which R06 allows."

- id: ratelimiter-D1-02
  project: ratelimiter
  category: D1
  label: drift
  target_rules: [R05]
  file: src/ratelimiter/bucket.py
  find: '        if self.tokens > BURST_LIMIT:'
  replace: '        if self.tokens > BURST_LIMIT + 1:'
  gold_symbol: TokenBucket.refill
  note: "Lets the bucket hold one token more than the burst limit."

- id: ratelimiter-D1-03
  project: ratelimiter
  category: D1
  label: drift
  target_rules: [R12]
  file: src/ratelimiter/limiter.py
  find: '        if stats.rejected >= BLOCK_AFTER_REJECTIONS:'
  replace: '        if stats.rejected > BLOCK_AFTER_REJECTIONS:'
  gold_symbol: RateLimiter._reject
  note: "Blocks only on the 6th rejection, not the 5th."

