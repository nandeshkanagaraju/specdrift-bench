# ------------------------------------------------------------- D3 omitted check

- id: ratelimiter-D3-01
  project: ratelimiter
  category: D3
  label: drift
  target_rules: [R05]
  file: src/ratelimiter/bucket.py
  find:
    - '        # R05 - the bucket is capped at the burst limit.'
    - '        if self.tokens > BURST_LIMIT:'
    - '            self.tokens = BURST_LIMIT'
  replace:
    - '        # Tokens accumulate while the client is idle.'
  gold_symbol: TokenBucket.refill
  note: "Burst cap deleted, so an idle client accrues unlimited tokens."

- id: ratelimiter-D3-02
  project: ratelimiter
  category: D3
  label: drift
  target_rules: [R12]
  file: src/ratelimiter/limiter.py
  find:
    - '        # R12 - blocked automatically at the rejection threshold.'
    - '        if stats.rejected >= BLOCK_AFTER_REJECTIONS:'
    - '            self.blocked.add(stats.client_id)'
  replace:
    - '        # Rejection counters are reported, not acted on.'
  gold_symbol: RateLimiter._reject
  note: "Automatic blocking removed entirely."

# -------------------------------------------------------- D4 weakened condition

- id: ratelimiter-D4-01
  project: ratelimiter
  category: D4
  label: drift
  target_rules: [R09]
  file: src/ratelimiter/limiter.py
  find: '        if client_id in self.blocked:'
  replace: '        if client_id in self.blocked and not self.buckets.get(client_id):'
  gold_symbol: RateLimiter.allow
  note: "A blocked client with a live bucket is admitted anyway."

- id: ratelimiter-D4-02
  project: ratelimiter
  category: D4
  label: drift
  target_rules: [R06, R08]
  file: src/ratelimiter/limiter.py
  find: '        if not bucket.has_token():'
  replace: '        if not bucket.has_token() and client_id in self.blocked:'
  gold_symbol: RateLimiter.allow
  note: "An empty bucket only rejects when the client is also blocked."

# ------------------------------------------------------- D5 sequence violation

- id: ratelimiter-D5-01
  project: ratelimiter
  category: D5
  label: drift
  target_rules: [R11]
  file: src/ratelimiter/limiter.py
  find:
    - '        bucket.consume()'
    - '        stats.allowed += 1'
    - ''
    - '        # R11 - the decision is logged after the token count has been updated.'
    - '        decision = Decision('
    - '            client_id=client_id,'
    - '            allowed=True,'
    - '            reason="ok",'
    - '            tokens_left=bucket.tokens,'
    - '            at=now,'
    - '        )'
  replace:
    - '        # R11 - the decision is logged after the token count has been updated.'
    - '        decision = Decision('
    - '            client_id=client_id,'
    - '            allowed=True,'
    - '            reason="ok",'
    - '            tokens_left=bucket.tokens,'
    - '            at=now,'
    - '        )'
    - '        bucket.consume()'
    - '        stats.allowed += 1'
  gold_symbol: RateLimiter.allow
  note: "Decision is built before the token is spent, so the log reports a stale count."

- id: ratelimiter-D5-02
  project: ratelimiter
  category: D5
  label: drift
  target_rules: [R10]
  file: src/ratelimiter/limiter.py
  find:
    - '        # R06/R08 - the bucket must hold at least one whole token.'
    - '        if not bucket.has_token():'
    - '            self._reject(stats)'
    - '            raise RateLimited(f"client {client_id} has {bucket.tokens:.2f} tokens")'
    - ''
    - '        # R07/R10 - consume only now that every check above has passed.'
    - '        bucket.consume()'
  replace:
    - '        # R07/R10 - consume only now that every check above has passed.'
    - '        bucket.consume()'
    - ''
    - '        # R06/R08 - the bucket must hold at least one whole token.'
    - '        if not bucket.has_token():'
    - '            self._reject(stats)'
    - '            raise RateLimited(f"client {client_id} has {bucket.tokens:.2f} tokens")'
  gold_symbol: RateLimiter.allow
  note: "Token is spent before the check, so a rejected request still costs one."

