# -------------------------------------------------------- D8 unauthorised creep

- id: ratelimiter-D8-01
  project: ratelimiter
  category: D8
  label: drift
  target_rules: []
  file: src/ratelimiter/limiter.py
  find: '    def report(self) -> list[ClientStats]:'
  replace:
    - '    def grant_bonus(self, client_id: str, tokens: float, now: float) -> float:'
    - '        """Hand a client extra tokens outside the refill schedule."""'
    - '        bucket = self.bucket_for(client_id, now)'
    - '        bucket.tokens += tokens'
    - '        return bucket.tokens'
    - ''
    - '    def report(self) -> list[ClientStats]:'
  gold_symbol: RateLimiter.grant_bonus
  note: "Out-of-band token grants are not authorised by any rule."

- id: ratelimiter-D8-02
  project: ratelimiter
  category: D8
  label: drift
  target_rules: [R09]
  file: src/ratelimiter/limiter.py
  find:
    - '        bucket = self.bucket_for(client_id, now)'
    - ''
    - '        # R06/R08 - the bucket must hold at least one whole token.'
  replace:
    - '        bucket = self.bucket_for(client_id, now)'
    - ''
    - '        # Trusted clients skip the bucket entirely.'
    - '        if client_id.startswith("internal-"):'
    - '            bucket.tokens = BURST_LIMIT'
    - ''
    - '        # R06/R08 - the bucket must hold at least one whole token.'
  gold_symbol: RateLimiter.allow
  note: "An undocumented allow-list exempts some clients from rate limiting."

