# -------------------------------------------------------- D8 unauthorised creep

- id: library-D8-01
  project: library
  category: D8
  label: drift
  target_rules: []
  file: src/library/service.py
  find: '    def list_loans(self, member_id: str) -> list[Loan]:'
  replace:
    - '    def renew(self, member_id: str, isbn: str, day: int) -> Loan:'
    - '        """Extend an active loan by a further loan period."""'
    - '        for loan in self.active_loans(member_id):'
    - '            if loan.isbn == isbn:'
    - '                loan.due_on = day + LOAN_PERIOD_DAYS'
    - '                return loan'
    - '        raise UnknownEntity(f"no active loan of {isbn} for member {member_id}")'
    - ''
    - '    def list_loans(self, member_id: str) -> list[Loan]:'
  gold_symbol: LibraryService.renew
  note: "Renewals are not authorised by any rule in the spec."

- id: library-D8-02
  project: library
  category: D8
  label: drift
  target_rules: [R09]
  file: src/library/service.py
  find:
    - '                # R13 - fee is charged per day past the due date.'
    - '                return late_fee(day - loan.due_on)'
  replace:
    - '                # R13 - fee is charged per day past the due date.'
    - '                fee = late_fee(day - loan.due_on)'
    - '                # Repeat offenders are suspended automatically.'
    - '                if fee > Decimal("10.00"):'
