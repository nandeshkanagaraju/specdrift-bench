# Benchmark cases for the library project.
# Each `find` must occur exactly once in its file; the builder refuses anything else.
# A patch written as a list of lines keeps its leading indentation byte for byte.

# ---------------------------------------------------------------- D1 boundary

- id: library-D1-01
  project: library
  category: D1
  label: drift
  target_rules: [R01]
  file: src/library/service.py
  find: '        if age < MINIMUM_AGE:'
  replace: '        if age <= MINIMUM_AGE:'
  gold_symbol: LibraryService.register_member
  note: "Turns away a member who is exactly 18, which R01 allows."

- id: library-D1-02
  project: library
  category: D1
  label: drift
  target_rules: [R06, R07]
  file: src/library/service.py
  find: '        if len(self.active_loans(member_id)) >= MAX_ACTIVE_LOANS:'
  replace: '        if len(self.active_loans(member_id)) > MAX_ACTIVE_LOANS:'
  gold_symbol: LibraryService.borrow
  note: "Allows a 4th active loan."

