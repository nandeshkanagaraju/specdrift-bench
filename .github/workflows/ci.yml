name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,llm]"
      - name: Lint
        run: ruff check specdrift tests
      - name: Types
        run: mypy
      - name: Build the cases and restore the frozen results
        # tests/test_api.py serves the repository's real cases and results; both are generated or ignored by git,
        # so a clean checkout has neither. The committed snapshot stands in for results/.
        run: |
          specdrift build
          mkdir -p results
          cp -R results-snapshot/annotated/. results/
      - name: Tests
        # No test calls a real model; LLM_PROVIDER stays "fake".
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck and build
        run: npx tsc -b && npm run build
