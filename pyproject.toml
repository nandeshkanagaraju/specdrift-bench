[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "specdrift"
version = "0.1.0"
description = "SpecDrift-Bench: a benchmark for specification-drift detection"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "typer>=0.12",
    "pyyaml>=6",
    "numpy>=1.26",
    "jinja2>=3.1",
    "python-dotenv>=1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sse-starlette>=2",
]

[project.optional-dependencies]
llm = ["openai>=1.30", "anthropic>=0.25"]
embed = ["sentence-transformers>=2.7"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
specdrift = "specdrift.cli:app"

[tool.setuptools.packages.find]
include = ["specdrift*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Some tests import `tests.conftest`; plain `pytest` (as CI runs it) does not put the repo root on sys.path.
pythonpath = ["."]
# tests/fixtures holds whole projects (with their own tests) that other tests run in a sandbox copy.
norecursedirs = ["fixtures", ".*", "build", "dist", "*.egg", "node_modules"]
filterwarnings = [
    # Starlette's TestClient warns about its own httpx usage; not ours to fix.
    "ignore::DeprecationWarning:starlette.*",
    "ignore:Using `httpx` with `starlette.testclient`:UserWarning",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["web", "work", "cache", "results", "results_noids", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]   # long lines are fine for prompts; B008 is FastAPI's Depends/Query idiom

[tool.mypy]
python_version = "3.11"
files = ["specdrift"]
ignore_missing_imports = true
warn_unused_ignores = true
